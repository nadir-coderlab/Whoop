name: WHOOP daily sync

on:
  schedule:
    - cron: "17 5 * * *"      # 8:17 AM Riyadh time, every day
    - cron: "43 7 * * *"      # 10:43 AM backup (GitHub sometimes delays or skips scheduled runs)
  workflow_dispatch:           # "Run workflow" button
  repository_dispatch:         # a new scale reading from the TV-box app (encrypted payload)
    types: [scale]
  push:
    branches: [main]
  issue_comment:               # the owner replied «جاهز» on the WHOOP login issue → start sign-in right away
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: whoop-sync
  cancel-in-progress: false

jobs:
  sync:
    # Issue comments only count when the owner writes «جاهز» on the login issue.
    if: >-
      github.event_name != 'issue_comment' || (
        contains(github.event.issue.labels.*.name, 'whoop-login') &&
        github.event.comment.user.login == github.repository_owner &&
        (contains(github.event.comment.body, 'جاهز') || contains(github.event.comment.body, 'ready')))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          U: ${{ secrets.WHOOP_USERNAME }}
          P: ${{ secrets.WHOOP_PASSWORD }}
          D: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          missing=""
          [ -z "$U" ] && missing="$missing WHOOP_USERNAME"
          [ -z "$P" ] && missing="$missing WHOOP_PASSWORD"
          [ -z "$D" ] && missing="$missing DASHBOARD_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets:$missing"; exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Restore encrypted data from cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw.vault
          key: whoop-vault-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: whoop-vault-

      - name: Unlock data
        env:
          VAULT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python vault.py unpack

      - name: Restore scale readings (encrypted, scale-data branch)
        run: |
          mkdir -p data/scale-branch
          if git fetch -q --depth 1 origin scale-data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data/scale-branch
          fi
          ls data/scale-branch

      - name: Add the new scale reading
        env:
          VAULT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SCALE_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || '' }}
        run: python scale.py ingest

      - name: Pull new WHOOP data
        env:
          WHOOP_USERNAME: ${{ secrets.WHOOP_USERNAME }}
          WHOOP_PASSWORD: ${{ secrets.WHOOP_PASSWORD }}
          WHOOP_START: ${{ vars.WHOOP_START }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS="--out data --hr6-days 0"
          if [ -n "$WHOOP_START" ]; then ARGS="$ARGS --start $WHOOP_START"; fi
          python whoop_export.py $ARGS

      - name: Lock data
        if: always()
        env:
          VAULT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python vault.py pack

      - name: Save encrypted data to cache
        if: always() && hashFiles('data/raw.vault') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw.vault
          key: whoop-vault-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save scale readings (encrypted) to the scale-data branch
        if: always() && hashFiles('data/scale.changed') != ''
        run: |
          cd data/scale-branch
          printf '%s\n' "# بيانات الميزان (مشفّرة)" "" "weights.enc.json = كل قراءات الميزان، مشفّرة AES-256-GCM بكلمة مرور الصفحة." "يحدّثها \`scale.py\` تلقائي؛ لا تعدّل هذا الفرع بيدك." > README.md
          git init -q -b scale-data
          git config user.name  "whoop-bot"
          git config user.email "whoop-bot@users.noreply.github.com"
          git add -A && git commit -qm "scale readings $(date -u +%F)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scale-data
          echo "Saved $(cat ../scale.changed) new scale reading(s)"

      - name: Build encrypted dashboard data
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python analyze.py --csv data/csv --scale data/scale/weights.json --out site

      - name: Publish to GitHub Pages (gh-pages branch)
        run: |
          mkdir -p /tmp/pub && cp site/index.html site/data.enc.json /tmp/pub/ && touch /tmp/pub/.nojekyll
          # رابط قصير لتطبيق التلفزيون (Downloader): …github.io/Whoop/tv.apk
          curl -fsSL -o /tmp/pub/tv.apk "https://github.com/${{ github.repository }}/releases/download/tv-latest/MizaniTV.apk" || rm -f /tmp/pub/tv.apk
          cd /tmp/pub
          git init -q -b gh-pages
          git config user.name  "whoop-bot"
          git config user.email "whoop-bot@users.noreply.github.com"
          git add -A && git commit -qm "dashboard $(date -u +%F)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published → https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
